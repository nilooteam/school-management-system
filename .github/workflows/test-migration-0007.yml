# One-off validation of the rewritten migration 0007 on a scratch D1 database
# (temporary; deleted by the fix commit once it passes). Proves, on real D1,
# that PRAGMA foreign_keys=OFF works inside a wrangler migration batch and
# that the Asset rebuild preserves every row, including Booking rows that
# reference assets (ON DELETE CASCADE would delete them with FKs on).
name: Test migration 0007 on scratch D1 (one-off)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-migration:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DB: bahar-mig-test-20261116
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Create scratch D1 database
        run: bunx wrangler d1 create "$DB"
      - name: Seed minimal live-like schema + rows
        run: |
          cat > /tmp/seed.sql <<'EOF'
          CREATE TABLE "School" (
              "id" TEXT NOT NULL PRIMARY KEY,
              "name" TEXT NOT NULL,
              "code" TEXT NOT NULL,
              "shadEnabled" BOOLEAN NOT NULL DEFAULT true,
              "custodianEnabled" BOOLEAN NOT NULL DEFAULT true,
              "createdAt" DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP,
              "updatedAt" DATETIME NOT NULL
          );
          CREATE UNIQUE INDEX "School_code_key" ON "School"("code");
          CREATE TABLE "User" (
              "id" TEXT NOT NULL PRIMARY KEY,
              "schoolId" TEXT,
              "nationalId" TEXT NOT NULL,
              CONSTRAINT "User_schoolId_fkey" FOREIGN KEY ("schoolId") REFERENCES "School" ("id") ON DELETE SET NULL ON UPDATE CASCADE
          );
          CREATE TABLE "Asset" (
              "id" TEXT NOT NULL PRIMARY KEY,
              "schoolId" TEXT NOT NULL,
              "name" TEXT NOT NULL,
              "code" TEXT NOT NULL,
              "category" TEXT NOT NULL DEFAULT 'OTHER',
              "location" TEXT,
              "status" TEXT NOT NULL DEFAULT 'OK',
              "custodianId" TEXT,
              "purchaseDate" DATETIME,
              "value" INTEGER,
              "note" TEXT,
              "createdAt" DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP,
              "updatedAt" DATETIME NOT NULL,
              CONSTRAINT "Asset_schoolId_fkey" FOREIGN KEY ("schoolId") REFERENCES "School" ("id") ON DELETE CASCADE ON UPDATE CASCADE,
              CONSTRAINT "Asset_custodianId_fkey" FOREIGN KEY ("custodianId") REFERENCES "User" ("id") ON DELETE SET NULL ON UPDATE CASCADE
          );
          CREATE UNIQUE INDEX "Asset_schoolId_code_key" ON "Asset"("schoolId", "code");
          CREATE TABLE "Booking" (
              "id" TEXT NOT NULL PRIMARY KEY,
              "assetId" TEXT,
              "title" TEXT NOT NULL,
              CONSTRAINT "Booking_assetId_fkey" FOREIGN KEY ("assetId") REFERENCES "Asset" ("id") ON DELETE CASCADE ON UPDATE CASCADE
          );
          CREATE TABLE "MaintenanceTicket" (
              "id" TEXT NOT NULL PRIMARY KEY,
              "assetId" TEXT,
              "title" TEXT NOT NULL,
              CONSTRAINT "MaintenanceTicket_assetId_fkey" FOREIGN KEY ("assetId") REFERENCES "Asset" ("id") ON DELETE SET NULL ON UPDATE CASCADE
          );
          INSERT INTO "School" VALUES ('cm-school-bahar01','هنرستان بهار','BH-1001',1,1,'2026-01-01','2026-01-01');
          INSERT INTO "User" VALUES ('1000000011','cm-school-bahar01','1000000011');
          INSERT INTO "User" VALUES ('3000000011','cm-school-bahar01','3000000011');
          INSERT INTO "Asset" VALUES ('a1','cm-school-bahar01','ویدئو پروژکتور','AST-001','PROJECTOR','کلاس ۱','OK','3000000011','2025-01-15',15000000,'note1','2026-01-01','2026-01-01');
          INSERT INTO "Asset" VALUES ('a2','cm-school-bahar01','لپ‌تاپ','AST-002','LAPTOP',NULL,'OK',NULL,NULL,25000000,NULL,'2026-01-01','2026-01-01');
          INSERT INTO "Booking" VALUES ('b1','a1','رزرو پروژکتور');
          INSERT INTO "MaintenanceTicket" VALUES ('m1','a1','تعمیر پروژکتور');
          EOF
          bunx wrangler d1 execute "$DB" --remote --file /tmp/seed.sql
      - name: Apply migration 0007 (candidate fix)
        run: bunx wrangler d1 execute "$DB" --remote --file migrations/0007_remove_custodian_role.sql
      - name: Verify result (fail the run on any mismatch)
        run: |
          set -e
          q() { bunx wrangler d1 execute "$DB" --remote --command "$1" --json; }
          echo "== Asset rows must be 2 =="
          q "SELECT COUNT(*) AS n FROM \"Asset\";" | grep -q '"n": 2'
          echo "== Booking row must survive with assetId a1 =="
          q "SELECT COUNT(*) AS n FROM \"Booking\";" | grep -q '"n": 1'
          q "SELECT assetId AS a FROM \"Booking\" WHERE id='b1';" | grep -q '"a": "a1"'
          echo "== MaintenanceTicket row must survive with assetId a1 =="
          q "SELECT COUNT(*) AS n FROM \"MaintenanceTicket\";" | grep -q '"n": 1'
          q "SELECT assetId AS a FROM \"MaintenanceTicket\" WHERE id='m1';" | grep -q '"a": "a1"'
          echo "== foreign_key_check must be empty =="
          q "SELECT COUNT(*) AS n FROM pragma_foreign_key_check;" | grep -q '"n": 0'
          echo "== unique index must exist =="
          q "SELECT COUNT(*) AS n FROM sqlite_master WHERE type='index' AND name='Asset_schoolId_code_key';" | grep -q '"n": 1'
          echo "== Asset SQL must keep schoolId FK and drop custodianId =="
          ASSET_SQL=$(q "SELECT sql AS s FROM sqlite_master WHERE type='table' AND name='Asset';")
          echo "$ASSET_SQL" | grep -q 'Asset_schoolId_fkey'
          if echo "$ASSET_SQL" | grep -q 'custodianId'; then echo "FAIL: custodianId still in Asset"; exit 1; fi
          echo "custodianId gone from Asset"
          echo "== School SQL must drop custodianEnabled =="
          SCHOOL_SQL=$(q "SELECT sql AS s FROM sqlite_master WHERE type='table' AND name='School';")
          if echo "$SCHOOL_SQL" | grep -q 'custodianEnabled'; then echo "FAIL: custodianEnabled still in School"; exit 1; fi
          echo "custodianEnabled gone from School"
          echo "ALL SCRATCH-D1 CHECKS PASSED"
      - name: Delete scratch D1 database
        if: always()
        run: printf 'y\n' | bunx wrangler d1 delete "$DB" || true
