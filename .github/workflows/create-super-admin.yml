name: Create super admin
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  create:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/single-iranian-vocational-school
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Create super admin in D1
        run: |
          HASH=$(node -e "const c=require('node:crypto');const s=c.randomBytes(16).toString('hex');console.log(s+':'+c.scryptSync('demo1234',s,64).toString('hex'))")
          echo "HASH=$HASH"
          bunx wrangler d1 execute bahar-db --remote --command "INSERT INTO [User] (id, nationalId, passwordHash, tempPassword, mustChangePassword, role, permissions, firstName, lastName, isActive, failedAttempts, tokenVersion, twoFactorEnabled, createdAt, updatedAt) VALUES ('cm-admin-1000000011', '1000000011', '$HASH', 'demo1234', 0, 'SUPER_ADMIN', '[]', 'Sara', 'Mohammadi', 1, 0, 0, 0, datetime('now'), datetime('now'));"
          bunx wrangler d1 execute bahar-db --remote --command "SELECT id, nationalId, role, firstName, lastName, isActive FROM [User] WHERE nationalId = '1000000011';"
