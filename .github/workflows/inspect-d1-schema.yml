# One-off read-only inspection of the live D1 schema (temporary; delete after use).
# Used to determine the exact live state of Asset/School before fixing migration 0007.
name: Inspect live D1 schema (read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Inspect applied migrations and live Asset/School schema
        run: |
          echo "== d1_migrations =="
          bunx wrangler d1 execute bahar-db --remote --command "SELECT * FROM d1_migrations ORDER BY id;"
          echo "== live CREATE TABLE / indexes for Asset and School =="
          bunx wrangler d1 execute bahar-db --remote --command "SELECT type, name, tbl_name, sql FROM sqlite_master WHERE tbl_name IN ('Asset','School') ORDER BY type, name;"
          echo "== PRAGMA table_info Asset =="
          bunx wrangler d1 execute bahar-db --remote --command "PRAGMA table_info(\"Asset\");" || echo "PRAGMA table_info unsupported here"
          echo "== PRAGMA table_info School =="
          bunx wrangler d1 execute bahar-db --remote --command "PRAGMA table_info(\"School\");" || echo "PRAGMA table_info unsupported here"
          echo "== PRAGMA foreign_key_list Asset =="
          bunx wrangler d1 execute bahar-db --remote --command "PRAGMA foreign_key_list(\"Asset\");" || echo "PRAGMA foreign_key_list unsupported here"
          echo "== Asset row count =="
          bunx wrangler d1 execute bahar-db --remote --command "SELECT COUNT(*) AS asset_rows FROM \"Asset\";"
          echo "== Backup rows (all + latest AUTO) =="
          bunx wrangler d1 execute bahar-db --remote --command "SELECT COUNT(*) AS backup_rows FROM \"Backup\";"
          bunx wrangler d1 execute bahar-db --remote --command "SELECT id, filename, kind, sizeBytes, recordCount, createdAt FROM \"Backup\" ORDER BY createdAt DESC LIMIT 5;"
          bunx wrangler d1 execute bahar-db --remote --command "SELECT id, filename, kind, sizeBytes, recordCount, createdAt FROM \"Backup\" WHERE kind = 'AUTO' ORDER BY createdAt DESC LIMIT 5;"
