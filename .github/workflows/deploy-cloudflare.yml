name: Deploy Bahar to Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bahar-cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./db/custom.db"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BAHAR_SESSION_SECRET: ${{ secrets.BAHAR_SESSION_SECRET }}
    steps:
      - name: Check out project
        uses: actions/checkout@v4
        with:
          ref: refactor/single-iranian-vocational-school

      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing GitHub secret: CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing GitHub secret: CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test "${#BAHAR_SESSION_SECRET}" -ge 32 || { echo "Missing or too-short GitHub secret: BAHAR_SESSION_SECRET (minimum 32 characters)"; exit 1; }

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Validate Prisma schema and types
        run: |
          bunx prisma validate
          bunx tsc --noEmit

      - name: Apply database migrations to D1
        run: bunx wrangler d1 migrations apply bahar-db --remote

      - name: Configure production session secret
        shell: bash
        run: printf '%s' "$BAHAR_SESSION_SECRET" | bunx wrangler secret put SESSION_SECRET --name bahar-school-system

      - name: Build and deploy Cloudflare Worker
        run: |
          bunx opennextjs-cloudflare build
          bunx opennextjs-cloudflare deploy
